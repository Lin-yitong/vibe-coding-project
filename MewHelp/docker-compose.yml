services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: mewhelp
      MYSQL_USER: mewhelp
      MYSQL_PASSWORD: mewhelp
      MYSQL_ROOT_PASSWORD: mewhelp-root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pmewhelp-root"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # Deliberately bind-mount only initialization scripts: demo data is ephemeral.
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
